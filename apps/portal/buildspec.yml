version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 24

  pre_build:
    commands:
      - export CI=true
      - npm install -g pnpm@10.33.4
      # Install sempre do zero. Com --frozen-lockfile o pnpm faz headless install e
      # considera "up to date" comparando com .modules.yaml — uma árvore parcial de
      # build anterior passa batida e o build quebra num pacote arbitrário.
      - rm -rf node_modules apps/*/node_modules packages/*/node_modules
      - pnpm install --frozen-lockfile

  build:
    on-failure: ABORT
    commands:
      - cd apps/portal
      - pnpm turbo run build --filter=@monorepo/portal
      - rm -rf dist/**/*.js.map

  post_build:
    commands:
      - aws s3 sync --delete ./dist s3://${DEPLOY_BUCKET}
      - aws cloudfront create-invalidation --distribution-id ${CF_ID} --paths /index.html
