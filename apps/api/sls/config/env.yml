# Cognito
COGNITO_CLIENT_ID: !Ref UserPoolClient
COGNITO_CLIENT_SECRET: !GetAtt UserPoolClient.ClientSecret
COGNITO_POOL_ID: !Ref UserPool

# Database
MAIN_TABLE_NAME: !Ref MainTable

# Buckets
MAIN_BUCKET: !Ref MainBucket

# Algolia
ALGOLIA_APP_ID: ${env:ALGOLIA_APP_ID}
ALGOLIA_ADMIN_API_KEY: ${env:ALGOLIA_ADMIN_API_KEY}
ALGOLIA_INDEX_NAME: ${env:ALGOLIA_INDEX_NAME}
ALGOLIA_TRENDING_INDEX_NAME: ${env:ALGOLIA_TRENDING_INDEX_NAME, ''}

# Secrets (set as actual env vars in deployment, not CloudFormation refs)
MASTER_SECRET: ${env:MASTER_SECRET}
EXPORT_SECRET: ${env:EXPORT_SECRET}

# OAuth (MCP): issuer is the public base URL of this API — the custom domain when
# configured, otherwise the default execute-api URL.
OAUTH_ISSUER_URL: !If
  - ShouldSetupAPIGWCustomDomain
  - https://${env:API_DOMAIN_NAME, ''}
  - !Join
    - ""
    - - https://
      - !Ref HttpApi
      - .execute-api.
      - !Ref AWS::Region
      - .amazonaws.com
WEB_APP_URL: ${env:WEB_APP_URL}
MCP_OAUTH_EXTRA_REDIRECT_URIS: ${env:MCP_OAUTH_EXTRA_REDIRECT_URIS, ''}

# Gemini (question anonymization detection)
GEMINI_API_KEY: ${env:GEMINI_API_KEY, 'changeme-gemini-api-key'}
