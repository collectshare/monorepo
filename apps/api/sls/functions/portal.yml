getPublishedForm:
  handler: src/main/functions/portal/getPublishedForm.handler
  events:
    - httpApi:
        method: GET
        path: /portal/datasets/{formId}

getPublishedFormData:
  handler: src/main/functions/portal/getPublishedFormData.handler
  events:
    - httpApi:
        method: GET
        path: /portal/datasets/{formId}/data

exportPublishedFormData:
  handler: src/main/functions/portal/exportPublishedFormData.handler
  # Reads every submission and runs one answers query per submission (N+1):
  # at 128 MB / 6 s, forms with ~50+ responses hit the timeout.
  memorySize: 1024
  timeout: 29
  events:
    - httpApi:
        method: GET
        path: /portal/datasets/{formId}/export

searchDatasets:
  handler: src/main/functions/portal/searchDatasets.handler
  events:
    - httpApi:
        method: GET
        path: /portal/search
