# Cognito
COGNITO_CLIENT_ID: !Ref UserPoolClient
COGNITO_CLIENT_SECRET: !GetAtt UserPoolClient.ClientSecret
COGNITO_POOL_ID: !Ref UserPool

# Database
MAIN_TABLE_NAME: !Ref MainTable

# Buckets
MAIN_BUCKET: !Ref MainBucket

# Algolia
ALGOLIA_APP_ID: ${env:ALGOLIA_APP_ID}
ALGOLIA_ADMIN_API_KEY: ${env:ALGOLIA_ADMIN_API_KEY}
ALGOLIA_INDEX_NAME: ${env:ALGOLIA_INDEX_NAME}

# Secrets (set as actual env vars in deployment, not CloudFormation refs)
MASTER_SECRET: ${env:MASTER_SECRET, 'changeme-master-secret'}

# Gemini (question anonymization detection)
GEMINI_API_KEY: ${env:GEMINI_API_KEY, 'changeme-gemini-api-key'}
